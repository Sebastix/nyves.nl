variables:
  URL: "https://nyves.nl"
  PROJECT_ROOT: "/var/www/vhosts/sebastix.nl/nyves.nl"
  SSH_USER: "sebastix"
  SSH_HOST: "nyves.nl"
  SSH_LOGIN: "sebastix@ximo1.ximology.com"

stages:
  - build
  - deploy

site:nuxt-build:
  image: node:24
  stage: build
  script:
    - npm install
    - npm run build
    #- npm run generate
  artifacts:
    expire_in: 3 hours
    paths:
      - .output/public
      - .output/server

deploy:prod:
  image: alpine
  rules:
    - if: '$CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "main"'
      when: manual
  stage: deploy
  environment:
    name: prod
    url: $URL
  before_script:
    - 'which ssh-agent || ( apk add --update openssh )'
    - apk add --update bash
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY_PROD" | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - '[[ -f /.dockerenv ]] && echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config'
    # Install rsync
    - apk add rsync
    - rsync --version
  script:
    - rsync -avz --delete --exclude-from='gitlab-ci/rsync-excludes.txt' -e ssh .nuxt/. $SSH_USER@ximo1.ximology.com:$PROJECT_ROOT/httpdocs/.nuxt
    - rsync -avz --delete --exclude-from='gitlab-ci/rsync-excludes.txt' -e ssh .output/. $SSH_USER@ximo1.ximology.com:$PROJECT_ROOT/httpdocs/.output
    - $SSH_LOGIN "cd $PROJECT_ROOT/httpdocs && npm serve"
    - echo "Deployment ready, check $URL"
  dependencies:
    - site:nuxt-build

